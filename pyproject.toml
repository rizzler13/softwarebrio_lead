[project]
name = "lead-enrich"
version = "0.1.0"
description = "Autonomous agent that crawls company websites and extracts structured intelligence for lead enrichment."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "instructor[groq]>=1.7.0",
    "groq>=0.11.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "tenacity>=8.2",
    "tiktoken>=0.7",
    "tavily-python>=0.5.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "browser-use>=0.13.0",
    "langchain-openai>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
